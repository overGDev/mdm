# Generated by 'mdm init'.
#
# Rebuilds the combined document on every push to a protected branch and
# opens (or updates) a pull request with the result against that branch, so
# 'document.md' always reflects the current sections without a team member
# having to run 'mdm build' locally before pushing. A pull request is used
# rather than a direct push so this works whether or not the target branch
# has branch protection rules requiring changes to go through a PR.
#
# The output path below is kept in sync with 'mdm/paths.yaml' automatically
# by 'mdm paths set output'; don't edit it by hand.
name: MDM Build

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write
  pull-requests: write

env:
  # mdm:output-path (regenerated by 'mdm paths set output')
  MDM_OUTPUT_PATH: "document.md"
  # Set to "false" to leave the generated pull request for manual review and
  # merge instead of auto-merging it once its checks pass.
  MDM_AUTO_MERGE: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdm
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/overGDev/mdm/releases/latest/download/mdm-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build document
        run: mdm build

      - name: Commit rebuilt document
        id: commit
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "$MDM_OUTPUT_PATH"

          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          build_branch="mdm-build/${TARGET_BRANCH}"
          git checkout -B "$build_branch"
          git commit -m "chore: rebuild document [skip ci]"
          git push --force origin "$build_branch"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$build_branch" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.ref_name }}
          BUILD_BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          existing_pr=$(gh pr list --head "$BUILD_BRANCH" --base "$TARGET_BRANCH" --state open --json number --jq '.[0].number')

          if [ -z "$existing_pr" ]; then
            gh pr create \
              --head "$BUILD_BRANCH" \
              --base "$TARGET_BRANCH" \
              --title "chore: rebuild document" \
              --body "Automated rebuild of \`$MDM_OUTPUT_PATH\` by MDM Build."
            pr_number=$(gh pr list --head "$BUILD_BRANCH" --base "$TARGET_BRANCH" --state open --json number --jq '.[0].number')
          else
            pr_number="$existing_pr"
          fi

          if [ "$MDM_AUTO_MERGE" = "true" ]; then
            gh pr merge "$pr_number" --squash --auto
          fi

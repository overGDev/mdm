# Generated by 'mdm init'.
#
# Rebuilds the combined document on every push to a protected branch and
# commits it back to that branch, so 'document.md' always reflects the
# current sections without a team member having to run 'mdm build' locally
# before pushing.
#
# The output path below is kept in sync with 'mdm/paths.yaml' automatically
# by 'mdm paths set output'; don't edit it by hand.
name: MDM Build

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write

env:
  # mdm:output-path (regenerated by 'mdm paths set output')
  MDM_OUTPUT_PATH: "document.md"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdm
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/overGDev/mdm/releases/latest/download/mdm-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build document
        run: mdm build

      - name: Commit built document
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f "$MDM_OUTPUT_PATH"
          git diff --staged --quiet || git commit -m "chore: rebuild document [skip ci]"
          git push
